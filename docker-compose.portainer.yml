# Private LAN only. No public exposure, no application database, no host binds.
# Tested branch should be reviewed before switching any existing Portainer stack.
services:
  qrframe:
    build:
      context: .
      dockerfile: Dockerfile
    image: qrframe-hoangthang:secure-lan
    container_name: qrframe-lan
    restart: unless-stopped
    ports:
      - "${QRFRAME_LAN_IP:-192.168.20.194}:${QRFRAME_LAN_PORT:-18890}:18090"
    networks:
      - qrframe_isolated
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.50
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
networks:
  qrframe_isolated:
    driver: bridge
    internal: true
