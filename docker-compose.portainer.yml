# qrframe fork – 1 lightweight Nginx container for internal LAN.
# Host IP is a default from previous configuration, NOT confirmed live.
# Override QRFRAME_LAN_IP and QRFRAME_LAN_PORT in Portainer if required.
services:
  qrframe:
    build:
      context: .
      dockerfile: Dockerfile
    image: qrframe-hoangthang:lan
    container_name: qrframe-lan
    restart: unless-stopped

    ports:
      - "${QRFRAME_LAN_IP:-192.168.20.194}:${QRFRAME_LAN_PORT:-18890}:18090"

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
