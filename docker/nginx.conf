server {
    listen 18090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    etag off;

    # Privacy: no routine visitor IP/User-Agent/access logs.
    access_log off;
    error_log /dev/stderr warn;

    # Strict offline-only policy. This intentionally breaks the legacy code editor,
    # external assets, module workers, HTML injection, cross-origin calls, etc.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
